<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NISHCHAL TECH - CapNepal AI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px rgba(255, 255, 255, 0.2) solid;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h3 {
            color: #d1d9e6;
            font-weight: normal;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 80%;
            padding: 12px 15px;
            border-radius: 25px;
            border: none;
            outline: none;
            font-size: 1em;
            margin-bottom: 15px;
            text-align: center;
        }

        button {
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #00c6ff;
        }

        .result-box {
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            text-align: left;
        }

        .result-box p {
            margin: 8px 0;
            font-size: 1.05em;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.95em;
            color: #ffcc00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CapNepal AI</h1>
        <h3>भिडियो क्याप्सन जेनेरेटर</h3>
        
        <form method="POST">
            <input type="text" name="video_topic" placeholder="भिडियोको विषय यहाँ लेख्नुहोस्..." required>
            <br>
            <button type="submit">क्याप्सन बनाउनुहोस्</button>
        </form>

        {% if caption %}
        <div class="result-box">
            <p><strong>📝 क्याप्सन:</strong> {{ caption }}</p>
            <p><strong>🔥 ह्याशट्यागहरू:</strong> <span style="color: #00c6ff;">{{ hashtags }}</span></p>
        </div>
        {% endif %}
    </div>

    <div class="footer">Proudly Powered by <strong>NISHCHAL TECH</strong></div>
</body>
</html>
