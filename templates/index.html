<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapNepal - TikTok Style Auto Subtitles</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px rgba(255, 255, 255, 0.2) solid;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 5px;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h3 {
            color: #d1d9e6;
            font-weight: normal;
            margin-bottom: 20px;
            font-size: 0.95em;
        }
        .file-upload-box {
            margin-bottom: 20px;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            padding: 15px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.1);
        }
        input[type="file"] {
            color: #fff;
            margin-top: 10px;
            width: 100%;
            font-size: 0.9em;
        }
        button {
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
        }
        button:hover { transform: scale(1.02); }
        .result-box {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            border-left: 5px solid #00c6ff;
        }
        video {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }
        .footer {
            margin-top: 20px;
            font-size: 0.85em;
            color: #ffcc00;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CapNepal AI</h1>
        <h3>भिडियोमा टिकटक स्टाइल सबटाइटल जोड्नुहोस्</h3>
        
        <form method="POST" enctype="multipart/form-data">
            <div class="file-upload-box">
                <label for="video_file" style="cursor: pointer; display: block;">📁 भिडियो छान्नुहोस्</label>
                <input type="file" name="video_file" id="video_file" accept="video/*" required>
            </div>
            <button type="submit">✨ सबटाइटल जेनेरेट गर्नुहोस्</button>
        </form>

        {% if output_video %}
        <div class="result-box">
            <p><strong>🎉 तयार भयो तपाईंको भिडियो!</strong></p>
            <video controls>
                <source src="{{ url_for('downloaded_file', filename=output_video) }}" type="video/mp4">
                तपाईको ब्राउजरले भिडियो सपोर्ट गरेन।
            </video>
            <br><br>
            <a href="{{ url_for('downloaded_file', filename=output_video) }}" download style="color: #00c6ff; font-weight: bold; text-decoration: none;">📥 भिडियो डाउनलोड गर्नुहोस्</a>
        </div>
        {% endif %}
    </div>

    <div class="footer">Proudly Powered by <strong>NISHCHAL TECH</strong></div>
</body>
</html>
