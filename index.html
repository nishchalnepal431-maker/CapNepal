<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NISHCHAL TECH - CapNepal AI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px rgba(255, 255, 255, 0.2) solid;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 10px;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }

        h2 {
            font-size: 1.5em;
            color: #d1d9e6;
            font-weight: normal;
        }

        .footer {
            margin-top: 30px;
            font-size: 1em;
            color: #ffcc00;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #00c6ff, 0 0 20px #00c6ff; }
            to { text-shadow: 0 0 20px #0072ff, 0 0 30px #0072ff; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CapNepal AI</h1>
        <h2>भिडियो क्याप्सन जेनेरेटर - Beta</h2>
        <div class="footer">Proudly Powered by <strong>NISHCHAL TECH</strong></div>
    </div>
</body>
</html>
